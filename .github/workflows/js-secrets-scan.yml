name: JS Secrets Scanner

on:
  workflow_dispatch:
    inputs:
      webhook_url:
        description: 'Discord webhook URL (optional, or set DISCORD_WEBHOOK secret)'
        required: false
        type: string

jobs:
  scan-js-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check urls.txt
        run: |
          if [ ! -f "urls.txt" ]; then
            echo "urls.txt not found in repository root!"
            exit 1
          fi
          echo "Found urls.txt - $(wc -l < urls.txt) URLs"

      - name: Prepare directories
        run: mkdir -p js_files results

      - name: Filter endpoints
        run: |
          grep -E '\.js|/api/|/v1/' urls.txt > endpoints.txt || true
          sort -u endpoints.txt -o endpoints.txt
          echo "Endpoints: $(wc -l < endpoints.txt)"

      - name: Download JS files
        run: |
          # Read endpoints to temp file to avoid pipe issues
          grep '\.js' endpoints.txt > js_urls.txt 2>/dev/null || true
          
          while IFS= read -r url || [ -n "$url" ]; do
            [ -z "$url" ] && continue
            filename="js_files/$(printf '%s' "$url" | md5sum | cut -d' ' -f1).js"
            echo "Downloading: $url"
            
            curl -sL --max-time 60 \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36" \
              --retry 2 \
              "$url" -o "$filename" 2>/dev/null || true
            
            if [ -s "$filename" ]; then
              echo "  OK: $(stat -c%s "$filename") bytes"
            else
              echo "  FAIL"
              rm -f "$filename"
            fi
          done < js_urls.txt
          
          echo "Downloaded: $(ls js_files/ 2>/dev/null | wc -l) files"

      - name: Scan JS files for secrets
        run: |
          cat > scan_secrets.py << 'PYEOF'
          import re, json
          from pathlib import Path

          PATTERNS = {
              'aws_access_key': r'AKIA[0-9A-Z]{16}',
              'aws_secret_key': r'[a-zA-Z0-9+/]{40}',
              'stripe_key': r'sk_(live|test)_[a-zA-Z0-9]{24}',
              'github_token': r'ghp_[a-zA-Z0-9]{36}',
              'slack_webhook': r'https://hooks\.slack\.com/services/[A-Z0-9]+/[A-Z0-9]+/[a-zA-Z0-9]+',
              'database_url': r'mongodb\+srv://[^:]+:[^@]+@[^\s"\']+',
              'jwt_secret': r'[A-Za-z0-9]{32,}',
              'api_key': r'api[_-]?key["\']?\s*[:=]\s*["\']([^"\']+)'
          }

          def get_context(content, match, window=50):
              s = match[0] if isinstance(match, tuple) and match[0] else str(match)
              i = content.find(s)
              if i == -1: return content[:100]
              return content[max(0,i-window):min(len(content),i+len(s)+window)].replace('\n',' ')

          findings = []
          for f in Path('js_files').rglob('*.js'):
              try:
                  c = f.read_text(encoding='utf-8', errors='ignore')
              except: continue
              for t, p in PATTERNS.items():
                  for m in re.findall(p, c, re.I):
                      findings.append({'file':str(f),'type':t,'secret':str(m) if not isinstance(m,tuple) else str(m[0]) if m[0] else str(m),'context':get_context(c,m)})

          report = {'total_findings': len(findings), 'findings': findings}
          Path('results').mkdir(exist_ok=True)
          json.dump(report, open('results/scan_report.json','w'), indent=2)
          
          with open('results/scan_report.txt','w') as f:
              f.write(f"JS Secrets Scan - {len(findings)} findings\n{'='*40}\n")
              for i,fd in enumerate(findings,1):
                  f.write(f"[{i}] {fd['type']}: {fd['secret'][:50]}...\n    File: {fd['file']}\n    Context: {fd['context'][:100]}...\n{'-'*40}\n")
              if not findings: f.write("No secrets found.\n")
          
          print(f"Found {len(findings)} secrets")
          PYEOF
          
          python3 scan_secrets.py

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: results/
          retention-days: 7

      - name: Send to Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ github.event.inputs.webhook_url || secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "No webhook"
            exit 0
          fi

          mkdir -p results
          REPORT="results/scan_report.json"
          [ -f "$REPORT" ] || echo '{"total_findings":0,"findings":[]}' > "$REPORT"
          
          SIZE=$(stat -c%s "$REPORT")
          TOTAL=$(python3 -c "import json;print(json.load(open('$REPORT'))['total_findings'])")
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          MSG="JS Secrets Scan Complete - Repo: ${{ github.repository }} - Findings: $TOTAL - $RUN_URL"

          if [ "$SIZE" -gt 8388608 ]; then
            curl -sd "{\"content\":\"$MSG\nReport >8MB: $RUN_URL\"}" -H "Content-Type: application/json" "$DISCORD_WEBHOOK"
          else
            curl -sF "payload_json={\"content\":\"$MSG\"}" -F "file1=@$REPORT" "$DISCORD_WEBHOOK"
          fi
