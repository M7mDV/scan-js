name: JS Secrets Scanner

on:
  workflow_dispatch:
    inputs:
      webhook_url:
        description: 'Discord webhook URL (optional, or set DISCORD_WEBHOOK secret)'
        required: false
        type: string

jobs:
  scan-js-files:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check urls.txt
        run: |
          if [ ! -f "urls.txt" ]; then
            echo "urls.txt not found in repository root!"
            echo "Please create a file named urls.txt with one URL per line."
            exit 1
          fi
          echo "Found urls.txt"
          echo "Total URLs: $(wc -l < urls.txt)"
          cat urls.txt

      - name: Prepare directories
        run: |
          mkdir -p js_files results
          echo "Directories ready"

      - name: Filter JS files and API endpoints
        run: |
          cat urls.txt | grep -E '\.js|/api/|/v1/' | sort -u > endpoints.txt
          echo "Total endpoints: $(wc -l < endpoints.txt)"
          cat endpoints.txt

       - name: Download JS files
        run: |
          mkdir -p js_files
          cat endpoints.txt | grep '\.js' | while read url; do
            filename="js_files/$(echo -n "$url" | md5sum | cut -d' ' -f1).js"
            echo "Downloading: $url"
            
            # Try with redirects, proper headers, and longer timeout
            curl -sL --max-time 60 \
              -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
              -H "Accept: text/html,application/xhtml+xml,application/xml;q=0.9,image/webp,*/*;q=0.8" \
              -H "Accept-Language: en-US,en;q=0.5" \
              --retry 2 --retry-delay 1 \
              "$url" -o "$filename" 2>/dev/null
            
            # Check result
            if [ -s "$filename" ]; then
              size=$(stat -c%s "$filename")
              echo "  ✅ Success: $size bytes -> $filename"
            else
              echo "  ❌ Failed: $url"
              rm -f "$filename"
            fi
          done
          
          echo ""
          echo "=== Download Summary ==="
          file_count=$(ls -1 js_files/ 2>/dev/null | wc -l)
          echo "Total files downloaded: $file_count"
          ls -la js_files/

      - name: Scan JS files for secrets
        run: |
          cat > scan_secrets.py << 'PYEOF'
          import re
          import json
          from pathlib import Path

          SECRET_PATTERNS = {
              'aws_access_key': r'AKIA[0-9A-Z]{16}',
              'aws_secret_key': r'[a-zA-Z0-9+/]{40}',
              'stripe_key': r'sk_(live|test)_[a-zA-Z0-9]{24}',
              'github_token': r'ghp_[a-zA-Z0-9]{36}',
              'slack_webhook': r'https://hooks\.slack\.com/services/[A-Z0-9]+/[A-Z0-9]+/[a-zA-Z0-9]+',
              'database_url': r'mongodb\+srv://[^:]+:[^@]+@[^\s"\']+',
              'jwt_secret': r'[A-Za-z0-9]{32,}',
              'api_key': r'api[_-]?key["\']?\s*[:=]\s*["\']([^"\']+)'
          }

          def get_context(content, match, window=50):
              if isinstance(match, tuple):
                  match_str = match[0] if match[0] else str(match)
              else:
                  match_str = str(match)
              idx = content.find(match_str)
              if idx == -1:
                  return content[:100]
              start = max(0, idx - window)
              end = min(len(content), idx + len(match_str) + window)
              return content[start:end].replace('\n', ' ')

          def scan_js_files(directory):
              findings = []
              js_dir = Path(directory)
              if not js_dir.exists():
                  return findings
              
              for js_file in js_dir.rglob('*.js'):
                  try:
                      content = js_file.read_text(encoding='utf-8', errors='ignore')
                  except Exception:
                      continue
                  
                  for secret_type, pattern in SECRET_PATTERNS.items():
                      try:
                          matches = re.findall(pattern, content, re.IGNORECASE)
                          if matches:
                              for match in matches:
                                  findings.append({
                                      'file': str(js_file),
                                      'type': secret_type,
                                      'secret': str(match) if not isinstance(match, tuple) else str(match[0]) if match[0] else str(match),
                                      'context': get_context(content, match)
                                  })
                      except re.error:
                          continue
              return findings

          if __name__ == '__main__':
              findings = scan_js_files('js_files')
              report = {
                  'total_findings': len(findings),
                  'findings': findings
              }
              
              with open('results/scan_report.json', 'w', encoding='utf-8') as f:
                  json.dump(report, f, indent=2, ensure_ascii=False)
              
              with open('results/scan_report.txt', 'w', encoding='utf-8') as f:
                  f.write("JS Secrets Scan Report\n")
                  f.write("="*50 + "\n")
                  f.write(f"Total Findings: {len(findings)}\n\n")
                  
                  if findings:
                      for i, finding in enumerate(findings, 1):
                          f.write(f"[{i}] Type: {finding['type']}\n")
                          f.write(f"    File: {finding['file']}\n")
                          f.write(f"    Secret: {finding['secret'][:50]}...\n")
                          f.write(f"    Context: ...{finding['context']}...\n")
                          f.write("-"*50 + "\n")
                  else:
                      f.write("No secrets found.\n")
              
              print(f"Scan complete. Found {len(findings)} potential secrets.")
          PYEOF
          
          python3 scan_secrets.py

      - name: Upload scan results artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-results
          path: results/
          retention-days: 7

      - name: Send results to Discord
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ github.event.inputs.webhook_url || secrets.DISCORD_WEBHOOK }}
          REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "No Discord webhook provided!"
            exit 1
          fi

          REPORT_FILE="results/scan_report.json"
          REPORT_SIZE=$(stat -c%s "$REPORT_FILE" 2>/dev/null || echo 0)
          MAX_SIZE=8388608

          TOTAL=$(python3 -c "import json; d=json.load(open('$REPORT_FILE')); print(d['total_findings'])")

          echo "Building Discord payload..."
          python3 << 'PYEOF'
          import json
          import os

          total = os.environ.get('TOTAL', '0')
          repo = os.environ.get('REPO', 'unknown')
          run_url = os.environ.get('RUN_URL', '')
          report_size = int(os.environ.get('REPORT_SIZE', '0'))
          max_size = 8388608
          report_file = 'results/scan_report.json'

          summary = f"JS Secrets Scan Complete\n\nRepository: {repo}\nTotal Findings: {total}\nRun: {run_url}"

          if report_size > max_size:
              content = summary + f"\n\nFull report exceeds 8MB.\nDownload from artifacts: {run_url}"
              payload = {"content": content}
              with open('discord_payload.json', 'w') as f:
                  json.dump(payload, f)
              print("LINK_ONLY")
          else:
              payload = {"content": summary}
              with open('discord_payload.json', 'w') as f:
                  json.dump(payload, f)
              print("WITH_FILE")
          PYEOF

          MODE=$(python3 -c "
          import json
          with open('discord_payload.json') as f:
              d = json.load(f)
          print('LINK_ONLY' if 'exceeds' in d['content'] else 'WITH_FILE')
          ")

          if [ "$MODE" = "LINK_ONLY" ]; then
              echo "Report too large, sending link only..."
              curl -s -H "Content-Type: application/json" \
                -d @discord_payload.json \
                "$DISCORD_WEBHOOK"
          else
              echo "Sending file with summary..."
              curl -s -H "Content-Type: multipart/form-data" \
                -F "payload_json=$(cat discord_payload.json)" \
                -F "file1=@$REPORT_FILE" \
                "$DISCORD_WEBHOOK"
          fi
